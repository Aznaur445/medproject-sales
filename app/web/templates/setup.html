{% extends "base.html" %}
{% block title %}Первый запуск · {{ app_name }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Первый запуск</h2>
  <p class="muted">Создайте учётную запись владельца. Ссылка одноразовая: после этого шага она перестанет работать.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/setup" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label for="username">Логин (латиницей)</label>
    <input id="username" name="username" value="{{ username or 'owner' }}" autocomplete="username" required>
    <label for="password">Пароль (не короче 12 символов)</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="password2">Повторите пароль</label>
    <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="12" required>
    <button class="full" type="submit">Создать и перейти к настройке 2FA</button>
  </form>
</div>
{% endblock %}
